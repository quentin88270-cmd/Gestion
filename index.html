<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MEDIACO - Gestion Paie</title>
    
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #1a1a1a;
        }
        iframe {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100dvh;
            border: none; display: none;
        }
        #splash-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(160deg, #1a1a1a 0%, #2a2a2a 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999;
            gap: 0;
        }

        /* ── Logo grue SVG animé ── */
        .logo-container {
            position: relative;
            width: 120px; height: 120px;
            margin-bottom: 24px;
        }
        .crane-svg { width: 100%; height: 100%; }

        /* Balancement de la grue */
        .crane-hook {
            transform-origin: 78px 38px;
            animation: swing 2s ease-in-out infinite;
        }
        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50%       { transform: rotate(5deg); }
        }

        /* ── Textes ── */
        .brand-name {
            font-family: Arial, sans-serif;
            font-weight: 900;
            font-size: 32px;
            color: #ffc107;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1;
        }
        .brand-sub {
            font-family: Arial, sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 6px;
        }
        .brand-badge {
            margin-top: 18px;
            background: #ffc107;
            color: #000;
            font-family: Arial, sans-serif;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 5px 16px;
            border-radius: 20px;
        }

        /* ── Barre de chargement ── */
        .loader-bar-wrapper {
            margin-top: 40px;
            width: 140px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-bar {
            height: 100%;
            width: 40%;
            background: #ffc107;
            border-radius: 2px;
            animation: loading 1.4s ease-in-out infinite;
        }
        @keyframes loading {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
    </style>
</head>
<body>
    <div id="splash-screen">

        <!-- Grue SVG -->
        <div class="logo-container">
            <svg class="crane-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <!-- Flèche horizontale -->
                <rect x="10" y="30" width="100" height="7" rx="3" fill="#ffc107"/>
                <!-- Contrepoids -->
                <rect x="10" y="30" width="22" height="14" rx="3" fill="#e6a800"/>
                <!-- Tour verticale -->
                <rect x="52" y="36" width="10" height="75" rx="3" fill="#ffc107"/>
                <!-- Base -->
                <rect x="36" y="106" width="42" height="8" rx="4" fill="#e6a800"/>
                <!-- Tirant oblique -->
                <line x1="20" y1="30" x2="57" y2="10" stroke="#ffc107" stroke-width="3" stroke-linecap="round"/>
                <line x1="57" y1="10" x2="100" y2="30" stroke="#ffc107" stroke-width="3" stroke-linecap="round"/>
                <!-- Câble + crochet animé -->
                <g class="crane-hook">
                    <line x1="78" y1="37" x2="78" y2="72" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    <!-- Crochet -->
                    <path d="M74 72 Q70 72 70 78 Q70 85 78 85 Q86 85 86 78" 
                          fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Charge -->
                    <rect x="69" y="85" width="18" height="14" rx="3" fill="#ffc107" opacity="0.9"/>
                    <text x="78" y="96" text-anchor="middle" font-size="7" font-weight="bold" fill="#000">€</text>
                </g>
                <!-- Cabine -->
                <rect x="52" y="36" width="18" height="12" rx="2" fill="#e6a800"/>
                <rect x="54" y="38" width="8" height="7" rx="1" fill="#1a1a1a" opacity="0.6"/>
            </svg>
        </div>

        <div class="brand-name">MEDIACO</div>
        <div class="brand-sub">Gestion &amp; Paie</div>
        <div class="brand-badge">👔 Interface Responsable</div>

        <div class="loader-bar-wrapper">
            <div class="loader-bar"></div>
        </div>

    </div>

    <iframe id="app-frame" 
        src="https://script.google.com/macros/s/AKfycbw2rKJ6ssrFiFKNcX8EwPTl4RFFueAOhlgcI64q0OhKwTZCmIdZCS0qdr3A-zTxN1GBfA/exec?page=Paie" 
        onload="hideLoader()">
    </iframe>

    <script>
        function hideLoader() {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('app-frame').style.display = 'block';
        }
        setTimeout(function() { hideLoader(); }, 15000);
    </script>
</body>
</html>
